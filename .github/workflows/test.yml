name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit formula
        run: brew audit --strict --formula Formula/pamie.rb

      - name: Install formula
        run: brew install --build-from-source Formula/pamie.rb

      - name: Test formula
        run: brew test pamie
